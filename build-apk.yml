name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FC-Career-Manager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FC-Career-Manager-APK
          path: FC-Career-Manager.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FC Career Manager (última versión)
          files: FC-Career-Manager.apk
